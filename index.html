<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --bg: #000000;
    --black: #000000;
    --red: #AA0000;    --br-red: #FF5555;
    --green: #00AA00;  --br-green: #55FF55;
    --yellow: #AA5500; --br-yellow: #FFFF55;
    --blue: #0000AA;   --br-blue: #5555FF;
    --magenta: #AA00AA;--br-magenta: #FF55FF;
    --cyan: #00AAAA;   --br-cyan: #55FFFF;
    --white: #AAAAAA;  --br-white: #FFFFFF;
  }

  body {
    background-color: var(--bg);
    color: var(--white);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* CRT Scanline Effect */
  body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 4px, 3px 100%;
    pointer-events: none;
  }

  #terminal { width: 100%; max-width: 800px; white-space: pre-wrap; line-height: 1.1; z-index: 1; }
  
  /* ANSI Colors */
  .f-black { color: var(--black); } .b-black { background-color: var(--black); }
  .f-red { color: var(--red); } .b-red { background-color: var(--red); }
  .f-green { color: var(--green); } .b-green { background-color: var(--green); }
  .f-yellow { color: var(--yellow); } .b-yellow { background-color: var(--yellow); }
  .f-blue { color: var(--blue); } .b-blue { background-color: var(--blue); }
  .f-magenta { color: var(--magenta); } .b-magenta { background-color: var(--magenta); }
  .f-cyan { color: var(--cyan); } .b-cyan { background-color: var(--cyan); }
  .f-white { color: var(--white); } .b-white { background-color: var(--white); }
  
  .f-br-red { color: var(--br-red); font-weight: bold; }
  .f-br-green { color: var(--br-green); font-weight: bold; }
  .f-br-yellow { color: var(--br-yellow); font-weight: bold; }
  .f-br-blue { color: var(--br-blue); font-weight: bold; }
  .f-br-magenta { color: var(--br-magenta); font-weight: bold; }
  .f-br-cyan { color: var(--br-cyan); font-weight: bold; }
  .f-br-white { color: var(--br-white); font-weight: bold; }

  .cursor { display: inline-block; width: 10px; height: 18px; background-color: var(--white); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #hidden-input { position: absolute; opacity: 0; pointer-events: none; }
</style>
</head>
<body onclick="startDialing()">

<input type="text" id="hidden-input" autocomplete="off">
<div id="terminal">
<span class="f-br-yellow">*** TERMINAL READY ***</span>
<span class="f-white">Click anywhere to dial...</span>
<span class="cursor"></span>
</div>

<script>
  const terminal = document.getElementById('terminal');
  const input = document.getElementById('hidden-input');
  const modemSound = new Audio('https://www.soundjay.com/communication/modem-connect-01.mp3');
  
  let connected = false;
  let currentState = 'OFFLINE';

  const splashArt = `
<span class="f-br-magenta">      _    _  _  _      _               _    _  </span>
<span class="f-br-magenta">     | |  | |(_)| |    | |             | |  | | </span>
<span class="f-br-cyan">     | |  | | _ | |  __| |  ___   __ _ | |_ | | </span>
<span class="f-br-cyan">     | |/\\| || || | / _\` | / __| / _\` || __|| | </span>
<span class="f-br-blue">     \\  /\\  /| || || (_| || (__ | (_| || |_ |_| </span>
<span class="f-br-blue">      \\/  \\/ |_||_| \\__,_| \\___| \\__,_| \\__|(_) </span>
<span class="f-br-yellow">                                                </span>
<span class="f-br-white">       ---= THE ULTIMATE SHAREWARE STOP =---     </span>
`;

  async function startDialing() {
    if (connected) { input.focus(); return; }
    
    terminal.innerHTML = "<span class='f-br-white'>ATDT 555-8291</span>\n";
    modemSound.play();
    
    await new Promise(r => setTimeout(r, 2000));
    terminal.innerHTML += "DIALING...\n";
    
    await new Promise(r => setTimeout(r, 4000));
    terminal.innerHTML += "<span class='f-br-green'>CONNECT 14400 / ARQ</span>\n\n";
    
    await new Promise(r => setTimeout(r, 800));
    terminal.innerHTML = splashArt;
    terminal.innerHTML += "\n<span class='f-br-yellow'>Press any key to enter...</span><span class='cursor'></span>";
    
    connected = true;
    currentState = 'SPLASH';
    input.focus();
  }

  function showMainMenu() {
    currentState = 'MAIN';
    terminal.innerHTML = `
<span class="f-br-blue">═══</span><span class="f-br-white"> WILDCAT! BBS MAIN MENU </span><span class="f-br-blue">══════════════════════════</span>
 <span class="f-br-yellow">[1]</span> <span class="f-br-cyan">Message Board</span>
 <span class="f-br-yellow">[2]</span> <span class="f-br-cyan">File Library</span>
 <span class="f-br-yellow">[3]</span> <span class="f-br-cyan">System Information</span>
 <span class="f-br-yellow">[4]</span> <span class="f-br-red">Log Off</span>
<span class="f-br-blue">════════════════════════════════════════════════════════</span>
<span class="f-white">Command >> </span><span class="cursor"></span>`;
  }

  function showFileLibrary() {
    currentState = 'LIBRARY';
    terminal.innerHTML = `
<span class="f-br-blue">═══</span><span class="f-br-white"> FILE LIBRARY CATEGORIES </span><span class="f-br-blue">═════════════════════════</span>
 <span class="f-br-yellow">[U]</span> <span class="f-br-cyan">Utilities (PKZIP, Norton, etc)</span>
 <span class="f-br-yellow">[G]</span> <span class="f-br-cyan">Games (Doom, Wolf3D, Keen)</span>
 <span class="f-br-yellow">[A]</span> <span class="f-br-cyan">Apps (Procomm, Telix)</span>
 <span class="f-br-yellow">[M]</span> <span class="f-br-white">Back to Main Menu</span>
<span class="f-br-blue">════════════════════════════════════════════════════════</span>
<span class="f-white">Select Category >> </span><span class="cursor"></span>`;
  }

  const files = {
    'U': [
        { name: 'PKZ204G.EXE', desc: 'PKZIP 2.04g Utility', size: '202k' },
        { name: 'DS20.ZIP', desc: 'Directory Sort', size: '15k' },
        { name: 'LHA213.EXE', desc: 'LHArc Archiver', size: '45k' }
    ],
    'G': [
        { name: 'DOOM_SW.ZIP', desc: 'DOOM Shareware v1.9', size: '2.4M' },
        { name: 'WOLF3D.ZIP', desc: 'Wolfenstein 3D Ep1', size: '1.2M' },
        { name: 'KEEN1.ZIP', desc: 'Commander Keen 1', size: '350k' }
    ],
    'A': [
        { name: 'PCPLUS.ZIP', desc: 'Procomm Plus v2.01', size: '890k' },
        { name: 'TELIX321.ZIP', desc: 'Telix v3.21 Comm', size: '540k' }
    ]
  };

  let selectedCategory = '';
  let selectedFile = null;

  function showCategory(cat) {
    selectedCategory = cat;
    currentState = 'CATEGORY';
    const catFiles = files[cat];
    let fileList = `<span class="f-br-blue">═══</span><span class="f-br-white"> FILES IN CATEGORY: ${cat} </span><span class="f-br-blue">═══════════════════</span>\n`;
    catFiles.forEach((f, i) => {
        fileList += ` <span class="f-br-yellow">[${i+1}]</span> <span class="f-br-white">${f.name.padEnd(12)}</span> <span class="f-br-green">${f.size.padStart(6)}</span> <span class="f-cyan">- ${f.desc}</span>\n`;
    });
    fileList += `<span class="f-br-blue">════════════════════════════════════════════════════════</span>\n`;
    fileList += `<span class="f-white">Select File (1-${catFiles.length}) or </span><span class="f-br-yellow">[M]</span><span class="f-white">ain Menu >> </span><span class="cursor"></span>`;
    terminal.innerHTML = fileList;
  }

  function showProtocol(file) {
    selectedFile = file;
    currentState = 'PROTOCOL';
    terminal.innerHTML = `
<span class="f-br-blue">═══</span><span class="f-br-white"> SELECT DOWNLOAD PROTOCOL </span><span class="f-br-blue">════════════════════════</span>
 <span class="f-br-yellow">[X]</span> <span class="f-br-cyan">XMODEM (Checksum)</span>
 <span class="f-br-yellow">[Y]</span> <span class="f-br-cyan">YMODEM (Batch)</span>
 <span class="f-br-yellow">[Z]</span> <span class="f-br-magenta">ZMODEM (Streaming - Recommended)</span>
 <span class="f-br-yellow">[Q]</span> <span class="f-br-red">Quit Download</span>
<span class="f-br-blue">════════════════════════════════════════════════════════</span>
<span class="f-white">Protocol >> </span><span class="cursor"></span>`;
  }

  async function startDownload(protocol) {
    currentState = 'DOWNLOAD';
    terminal.innerHTML = `<span class="f-br-green">Initializing ${protocol} Transfer for ${selectedFile.name}...</span>\n`;
    terminal.innerHTML += `<span class="f-br-white">Sending ${selectedFile.name} (${selectedFile.size})</span>\n\n`;
    
    const barWidth = 25;
    for (let i = 0; i <= 100; i += 5) {
        const filled = Math.floor(i / (100 / barWidth));
        const empty = barWidth - filled;
        const bar = '<span class="f-br-blue">[</span>' + 
                    '<span class="f-br-yellow">' + '█'.repeat(filled) + '</span>' + 
                    '<span class="f-br-black">' + '░'.repeat(empty) + '</span>' + 
                    '<span class="f-br-blue">]</span>';
        
        terminal.innerHTML = `<span class="f-br-green">Initializing ${protocol} Transfer for ${selectedFile.name}...</span>\n` +
                             `<span class="f-br-white">Sending ${selectedFile.name} (${selectedFile.size})</span>\n\n` +
                             `${bar} <span class="f-br-white">${i}%</span>\n` +
                             `<span class="f-cyan">Block: ${Math.floor(i * 1.5)}/150  Errors: </span><span class="f-br-red">0</span>`;
        
        await new Promise(r => setTimeout(r, 200));
    }
    
    terminal.innerHTML += `\n\n<span class="f-br-green">*** TRANSFER COMPLETE ***</span>\n`;
    terminal.innerHTML += `<span class="f-white">Press </span><span class="f-br-yellow">[M]</span><span class="f-white"> to return to menu... </span><span class="cursor"></span>`;
  }

  input.addEventListener('input', (e) => {
    if (!connected) return;
    const val = e.target.value.toUpperCase();
    input.value = ""; 
    
    if (currentState === 'SPLASH') {
        showMainMenu();
        return;
    }

    if (currentState === 'MAIN') {
        if (val === '1') {
            terminal.innerHTML = "<span class='f-br-white'>LOADING MESSAGES...</span>\n<span class='f-br-yellow'>[M]</span> <span class='f-white'>Back to Main Menu</span> <span class='cursor'></span>";
            currentState = 'MESSAGES';
        } else if (val === '2') {
            showFileLibrary();
        } else if (val === '3') {
            terminal.innerHTML = `
<span class="f-br-blue">═══</span><span class="f-br-white"> SYSTEM INFORMATION </span><span class="f-br-blue">═══════════════════════════</span>
 <span class="f-cyan">SysOp:    </span><span class="f-br-white">spataray</span>
 <span class="f-cyan">Location: </span><span class="f-br-white">Honolulu, HI</span>
 <span class="f-cyan">Software: </span><span class="f-br-magenta">Wildcat! v4.0</span>
 <span class="f-cyan">Nodes:    </span><span class="f-br-green">1</span>
<span class="f-br-blue">════════════════════════════════════════════════════════</span>
<span class="f-white">Press </span><span class="f-br-yellow">[M]</span><span class="f-white"> to return to menu... </span><span class="cursor"></span>`;
            currentState = 'INFO';
        } else if (val === '4') {
            terminal.innerHTML = "<span class='f-br-red'>NO CARRIER</span>\n\n<span class='f-white'>Logged off at " + new Date().toLocaleTimeString() + "</span>";
            connected = false;
        }
    } else if (currentState === 'LIBRARY') {
        if (files[val]) { showCategory(val); }
        else if (val === 'M') { showMainMenu(); }
    } else if (currentState === 'CATEGORY') {
        const index = parseInt(val) - 1;
        const catFiles = files[selectedCategory];
        if (!isNaN(index) && catFiles[index]) { showProtocol(catFiles[index]); }
        else if (val === 'M') { showMainMenu(); }
    } else if (currentState === 'PROTOCOL') {
        if (['X', 'Y', 'Z'].includes(val)) { startDownload(val + 'MODEM'); }
        else if (val === 'Q') { showCategory(selectedCategory); }
    } else if (['DOWNLOAD', 'MESSAGES', 'INFO'].includes(currentState)) {
        if (val === 'M') { showMainMenu(); }
    }
  });

</script>
<div id="version-tag" style="position: fixed; bottom: 5px; right: 5px; font-size: 10px; color: rgba(170, 170, 170, 0.3); font-family: monospace;">v1.2.0 (2026-03-25 16:50 HST)</div>
</body>
</html>
